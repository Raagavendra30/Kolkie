<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niveditha ❤️</title>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#fff0f5,#ffe4ec);font-family:Arial,sans-serif;text-align:center}
.card{padding:30px;width:90%;max-width:700px}
button{padding:15px 32px;background:#e91e63;color:white;border:0;border-radius:30px;font-size:20px;font-weight:bold;cursor:pointer}
#images{display:none;margin-top:25px}
#images img{display:block;width:100%;max-width:600px;max-height:70vh;object-fit:contain;margin:20px auto;border-radius:18px;box-shadow:0 8px 25px rgba(0,0,0,.15)}
h1{color:#e91e63;margin-top:25px}
</style>
</head>
<body>
<div class="card">
<h2>Nivi My Cute Princess ❤️</h2>
<button onclick="showImages()">Click here ❤️</button>
<div id="images">
<img src="./Nivi.png" alt="My World">
<img src="./neethu.png" alt="My Muddhu">
<h1>I Love You Niveditha ❤️</h1>
</div>
</div>
<script>
function showImages(){document.getElementById("images").style.display="block";document.querySelector("button").style.display="none";}
</script>
</body>
</html>
