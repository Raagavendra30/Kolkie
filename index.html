<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Niveditha ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f5);
    overflow: hidden;
  }
  .card {
    text-align: center;
    padding: 48px 28px;
    max-width: 90%;
    background: rgba(255,255,255,.82);
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(180, 60, 100, .18);
  }
  .heart { font-size: 64px; animation: beat 1s infinite; }
  h1 { margin: 18px 0 8px; font-size: clamp(34px, 9vw, 58px); color: #c2185b; }
  p { margin: 0; font-size: 20px; color: #6d3048; }
  .small { margin-top: 22px; font-size: 15px; color: #9b6075; }
  @keyframes beat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.16); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>I Love You Niveditha</h1>
    <p>Forever and always. ❤️</p>
    <div class="small">Made with love just for you.</div>
  </div>
</body>
</html>
