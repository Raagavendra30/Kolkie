<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niveditha ❤️</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #fff0f5, #ffe4ec);
    font-family: Arial, sans-serif;
    text-align: center;
  }

  .card {
    width: 90%;
    max-width: 700px;
    padding: 30px;
  }

  button {
    padding: 15px 32px;
    background: #e91e63;
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
  }

  #images {
    display: none;
    margin-top: 25px;
  }

  #images img {
    display: block;
    width: 100%;
    max-width: 600px;
    max-height: 70vh;
    object-fit: contain;
    margin: 20px auto;
    border-radius: 18px;
  }

  h1 {
    color: #e91e63;
  }
</style>
</head>

<body>
<div class="card">
  <h2>❤️</h2>

  <button id="clickButton" onclick="showImages()">Click here ❤️</button>

  <div id="images">
    <img src="./Nivi.png" alt="Niveditha">
    <img src="./neethu.png" alt="Niveditha">
    <h1>I Love You Niveditha ❤️</h1>
  </div>
</div>

<script>
function showImages() {
  document.getElementById("images").style.display = "block";
  document.getElementById("clickButton").style.display = "none";
}
</script>
</body>
</html>
